<!doctype html>
<html lang="ne">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <title>Laxman PDF Books</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./"><span class="brand-mark">L</span><span>Laxman PDF Books</span></a>
    <div class="top-actions">
      <button id="themeBtn" class="icon-btn" aria-label="Toggle theme">☾</button>
    </div>
  </header>

  <main>
    <section class="hero">
      <div>
        <p class="eyebrow">DIGITAL LIBRARY</p>
        <h1>पढ्नुहोस्। सुन्नुहोस्। बुझ्नुहोस्।</h1>
        <p class="hero-copy">तपाईंले GitHub मा राखेका PDF किताबहरूलाई सफा reader, progress tracking र AI Read Mode सहित पढ्ने ठाउँ।</p>
      </div>
      <div class="hero-stats"><strong id="bookCount">0</strong><span>books</span></div>
    </section>

    <section class="toolbar">
      <label class="search"><span>⌕</span><input id="search" type="search" placeholder="किताब खोज्नुहोस्..." autocomplete="off"></label>
      <select id="category"><option value="all">सबै श्रेणी</option></select>
    </section>

    <section id="library" class="library" aria-live="polite"></section>
  </main>

  <footer>© Laxman Nepal · PDF Books</footer>

  <script src="app.js" defer></script>
</body>
</html>
