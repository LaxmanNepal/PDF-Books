<!doctype html><html lang="ne"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reading — Laxman PDF Books</title><link rel="stylesheet" href="styles.css"><style>body{overflow:hidden}.reader{height:calc(100vh - 64px);display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:0}.pdf-pane{background:#1a1d26;overflow:auto;display:flex;justify-content:center;padding:28px}.page-wrap{max-width:900px;width:100%}canvas{display:block;width:100%;height:auto;background:white;box-shadow:0 20px 60px #0006;margin:0 auto 22px}.side{overflow:auto;border-left:1px solid #ffffff12;background:#0c101b;padding:22px}.side h1{font-size:22px}.reader-controls{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.reader-controls button,.reader-controls select{border:1px solid #ffffff14;background:#ffffff0d;color:inherit;border-radius:10px;padding:10px;cursor:pointer}.progress{height:5px;background:#ffffff12;border-radius:5px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:#7562ff}.ai-card{margin-top:18px;padding:16px;border-radius:18px;background:linear-gradient(145deg,#171e39,#101522);border:1px solid #ffffff12}.ai-status{font-size:13px;color:#aeb8d2;line-height:1.6}.transcript{white-space:pre-wrap;line-height:1.75;color:#d7dbea;font-size:15px}.back{color:inherit;text-decoration:none;opacity:.8}@media(max-width:800px){body{overflow:auto}.reader{height:auto;display:flex;flex-direction:column}.pdf-pane{min-height:55vh}.side{border-left:0;border-top:1px solid #ffffff12}}
</style></head><body><header class="topbar"><a class="back" href="./">← Library</a><strong id="title">Loading…</strong><span></span></header><main class="reader"><section id="pdfPane" class="pdf-pane"><div id="pages" class="page-wrap"></div></section><aside class="side"><h1 id="bookTitle">Book</h1><div class="meta" id="pageInfo">Page 0</div><div class="reader-controls"><button id="play">▶ AI Read</button><button id="stop">■ Stop</button><button id="prev">← Prev</button><button id="next">Next →</button><select id="speed"><option value="0.8">0.8×</option><option value="1">1×</option><option value="1.2" selected>1.2×</option><option value="1.5">1.5×</option><option value="1.8">1.8×</option></select></div><div class="progress"><i id="bar"></i></div><div class="ai-card"><b>🤖 AI Read Mode</b><p class="ai-status" id="status">PDF text is extracted in your browser. Press AI Read and it will read the book continuously, page by page, without uploading the book to a server.</p></div><div class="ai-card"><b>Current page text</b><div id="transcript" class="transcript">Loading…</div></div></aside></main><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script><script type="module">import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs';pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';
const p=new URLSearchParams(location.search),url=p.get('pdf'),name=p.get('title')||'Book';let pdf,pages=[],current=1,playing=false;const $=s=>document.querySelector(s);$('#title').textContent=name;$('#bookTitle').textContent=name;
async function load(){pdf=await pdfjsLib.getDocument(url).promise;$('#pageInfo').textContent=`${pdf.numPages} pages`;for(let i=1;i<=pdf.numPages;i++){const page=await pdf.getPage(i);const vp=page.getViewport({scale:1.5});const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;c.dataset.page=i;await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;$('#pages').appendChild(c);const tc=await page.getTextContent();pages[i-1]=tc.items.map(x=>x.str).join(' ').replace(/\s+/g,' ').trim()}show(1)}
function show(n){current=Math.max(1,Math.min(pdf.numPages,n));const c=document.querySelector(`canvas[data-page="${current}"]`);c?.scrollIntoView({behavior:'smooth',block:'start'});$('#pageInfo').textContent=`Page ${current} / ${pdf.numPages}`;$('#bar').style.width=(current/pdf.numPages*100)+'%';$('#transcript').textContent=pages[current-1]||'No selectable text on this page.'}
function speakPage(){if(!playing)return;if(current>pdf.numPages){playing=false;return}const text=pages[current-1];if(!text){next();return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=Number($('#speed').value);u.onend=()=>{if(playing){if(current<pdf.numPages){current++;show(current);setTimeout(speakPage,250)}else{playing=false;$('#status').textContent='Finished reading the book.'}}};speechSynthesis.speak(u);$('#status').textContent=`AI Read is reading page ${current}…`}
function next(){if(current<pdf.numPages){show(current+1);if(playing)speakPage()}}function stop(){playing=false;speechSynthesis.cancel();$('#status').textContent='AI Read stopped.'}$('#play').onclick=()=>{playing=true;speakPage()};$('#stop').onclick=stop;$('#next').onclick=()=>{stop();next()};$('#prev').onclick=()=>{stop();show(current-1)};load().catch(e=>{$('#status').textContent='Could not open this PDF. Check that the file is publicly accessible.';console.error(e)});</script></body></html>
