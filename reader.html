<!doctype html><html lang="ne"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Reading — Laxman PDF Books</title><link rel="stylesheet" href="styles.css"><style>body{overflow:hidden}.reader{height:calc(100vh - 64px);display:grid;grid-template-columns:minmax(0,1fr) 370px}.pdf-pane{background:#171a23;overflow:auto;padding:26px}.page-wrap{max-width:900px;width:100%;margin:auto}.page-wrap.double{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:1400px}.page-wrap canvas{display:block;width:100%;height:auto;background:#fff;box-shadow:0 18px 55px #0007;margin:0 auto 22px}.side{overflow:auto;border-left:1px solid #ffffff12;background:#0c101b;padding:16px}.side h1{font-size:20px;margin:6px 0}.reader-controls{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.reader-controls button,.reader-controls select,.page-input,.search-input{border:1px solid #ffffff14;background:#ffffff0d;color:inherit;border-radius:10px;padding:9px 10px;cursor:pointer}.reader-controls button.active{background:#6655ee}.progress{height:5px;background:#ffffff12;border-radius:5px;overflow:hidden;margin:10px 0}.progress i{display:block;height:100%;width:0;background:#7562ff}.card{margin-top:12px;padding:14px;border-radius:17px;background:linear-gradient(145deg,#171e39,#101522);border:1px solid #ffffff12}.status{font-size:12px;color:#aeb8d2;line-height:1.55}.transcript{white-space:pre-wrap;line-height:1.75;color:#d7dbea;font-size:14px;max-height:220px;overflow:auto}.toc,.results{display:flex;flex-direction:column;gap:4px;max-height:210px;overflow:auto}.toc button,.results button{display:block;width:100%;text-align:left;border:0;background:transparent;color:#cfd6eb;padding:8px;border-radius:9px;cursor:pointer}.toc button.active,.toc button:hover,.results button:hover{background:#ffffff0b}.bookmark{font-size:12px;color:#aeb8d2}.searchbox{display:flex;gap:6px}.searchbox input{min-width:0;flex:1}.reader-top{display:flex;align-items:center;gap:10px;min-width:0}.reader-top strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.theme-sepia .pdf-pane{background:#d7c5a2}.theme-paper .pdf-pane{background:#eeeae1}.theme-sepia canvas,.theme-paper canvas{box-shadow:0 12px 35px #0003}.thumbs{display:flex;gap:5px;overflow:auto;padding:5px 0}.thumbs button{flex:0 0 48px;height:38px;border:1px solid #ffffff15;background:#ffffff08;color:#aaa;border-radius:8px;cursor:pointer}.thumbs button.active{border-color:#7562ff;color:#fff}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{padding:10px;border-radius:12px;background:#ffffff07}.stat b{display:block;font-size:17px}.stat span{font-size:11px;color:#9da6bd}.focus .side{display:none}.focus .reader{display:block}.focus .pdf-pane{height:calc(100vh - 64px)}@media(max-width:800px){body{overflow:auto}.reader{height:auto;display:flex;flex-direction:column}.pdf-pane{min-height:58vh;padding:12px}.side{border-left:0;border-top:1px solid #ffffff12}.page-wrap.double{display:block}.thumbs{display:none}.focus .pdf-pane{height:calc(100vh - 64px)}}</style></head><body><header class="topbar"><div class="reader-top"><a class="back" href="./">← Library</a><strong id="title">Loading…</strong></div><div class="reader-controls"><button id="focus" class="icon-btn">Focus</button><button id="fullscreen" class="icon-btn">⛶</button></div></header><main class="reader"><section class="pdf-pane"><div id="pages" class="page-wrap"></div></section><aside class="side"><h1 id="bookTitle">Book</h1><div class="meta" id="pageInfo">Loading…</div><div class="progress"><i id="bar"></i></div><div class="reader-controls"><button id="play">▶ AI Read</button><button id="stop">■ Stop</button><button id="prev">←</button><button id="next">→</button><button id="bookmark">🔖 Bookmark</button><button id="resume">↩ Resume</button></div><div class="reader-controls"><input id="pageInput" class="page-input" type="number" min="1" placeholder="Page"><button id="go">Go</button><select id="
