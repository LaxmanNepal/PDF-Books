<!doctype html>
<html lang="ne">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reading — Laxman PDF Books</title><link rel="stylesheet" href="styles.css">
<style>
body{overflow:hidden}.reader{height:calc(100vh - 64px);display:grid;grid-template-columns:minmax(0,1fr) 360px}.pdf-pane{background:#171a23;overflow:auto;padding:28px}.page-wrap{max-width:900px;width:100%;margin:auto}canvas{display:block;width:100%;height:auto;background:white;box-shadow:0 20px 60px #0006;margin:0 auto 22px;cursor:pointer}.side{overflow:auto;border-left:1px solid #ffffff12;background:#0c101b;padding:20px}.side h1{font-size:21px;margin:8px 0}.reader-controls{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.reader-controls button,.reader-controls select,.page-input{border:1px solid #ffffff14;background:#ffffff0d;color:inherit;border-radius:10px;padding:9px 10px;cursor:pointer}.progress{height:5px;background:#ffffff12;border-radius:5px;overflow:hidden;margin:12px 0}.progress i{display:block;height:100%;width:0;background:#7562ff}.card{margin-top:14px;padding:15px;border-radius:17px;background:linear-gradient(145deg,#171e39,#101522);border:1px solid #ffffff12}.status{font-size:12px;color:#aeb8d2;line-height:1.55}.transcript{white-space:pre-wrap;line-height:1.75;color:#d7dbea;font-size:14px;max-height:260px;overflow:auto}.toc{display:flex;flex-direction:column;gap:5px;max-height:240px;overflow:auto}.toc button{text-align:left;border:0;background:transparent;color:#cfd6eb;padding:8px;border-radius:9px;cursor:pointer}.toc button.active,.toc button:hover{background:#ffffff0b}.bookmark{font-size:12px;color:#aeb8d2}.focus .side{display:none}.focus .reader{display:block}.focus .pdf-pane{height:calc(100vh - 64px)}
@media(max-width:800px){body{overflow:auto}.reader{height:auto;display:flex;flex-direction:column}.pdf-pane{min-height:55vh}.side{border-left:0;border-top:1px solid #ffffff12}.focus .pdf-pane{height:calc(100vh - 64px)}}
</style></head>
<body>
<header class="topbar"><a class="back" href="./">← Library</a><strong id="title">Loading…</strong><button id="focus" class="icon-btn">Focus</button></header>
<main class="reader"><section id="pdfPane" class="pdf-pane"><div id="pages" class="page-wrap"></div></section>
<aside class="side"><h1 id="bookTitle">Book</h1><div class="meta" id="pageInfo">Loading…</div><div class="reader-controls"><button id="play">▶ AI Read</button><button id="stop">■ Stop</button><button id="prev">←</button><button id="next">→</button><button id="bookmark">🔖 Save</button><button id="resume">↩ Resume</button></div><div class="reader-controls"><input id="pageInput" class="page-input" type="number" min="1" placeholder="Page"><button id="go">Go</button><select id="speed"><option value="0.8">0.8×</option><option value="1">1×</option><option value="1.2" selected>1.2×</option><option value="1.5">1.5×</option><option value="1.8">1.8×</option></select></div><div class="progress"><i id="bar"></i></div>
<div class="card"><b>🤖 AI Read Mode</b><p class="status" id="status">Browser-based narration. The PDF stays in your browser.</p></div>
<div class="card"><b>📑 Chapters</b><div id="toc" class="toc"><span class="status">Detecting headings…</span></div></div>
<div class="card"><b>Current page</b><div id="transcript" class="transcript">Loading…</div></div>
<div class="card"><b>🔖 Saved</b><div id="saved" class="bookmark">No saved page yet.</div></div>
</aside></main>
<script type="module">
import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';
const q=new URLSearchParams(location.search),url=q.get('pdf'),name=q.get('title')||'Book',key='pdfbooks:'+url;let pdf,pages=[],current=1,playing=false,headings=[];const $=s=>document.querySelector(s);
$('#title').textContent=name;$('#bookTitle').textContent=name;
function save(){localStorage.setItem(key,JSON.stringify({page:current,bookmark:localStorage.getItem(key+':bookmark')}));}
function show(n,scroll=true){if(!pdf)return;current=Math.max(1,Math.min(pdf.numPages,n));const c=document.querySelector(`canvas[data-page="${current}"]`);if(scroll)c?.scrollIntoView({behavior:'smooth',block:'start'});$('#pageInfo').textContent=`Page ${current} / ${pdf.numPages}`;$('#bar').style.width=(current/pdf.numPages*100)+'%';$('#transcript').textContent=pages[current-1]||'No selectable text on this page.';$('#pageInput').value=current;save();document.querySelectorAll('.toc button').forEach(b=>b.classList.toggle('active',Number(b.dataset.page)===current));}
function stop(){playing=false;speechSynthesis.cancel();$('#status').textContent='AI Read stopped.';}
function speak(){if(!playing)return;if(current>pdf.numPages){playing=false;return}const text=pages[current-1];if(!text){next();return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=Number($('#speed').value);u.onend=()=>{if(!playing)return;if(current<pdf.numPages){show(current+1);setTimeout(speak,200)}else{playing=false;$('#status').textContent='Finished reading the book.'}};speechSynthesis.speak(u);$('#status').textContent=`Reading page ${current}…`;}
function next(){if(current<pdf.numPages){show(current+1);if(playing)speak()}}function prev(){if(current>1){show(current-1)}}
function detectChapters(){headings=[];pages.forEach((text,i)=>{const lines=text.split(/(?<=[.!?])\s+|\n/).map(x=>x.trim()).filter(Boolean);for(const line of lines.slice(0,8)){if(line.length>=3&&line.length<=90&&(/^(अध्याय|परिच्छेद|भाग|chapter|part|prologue|epilogue)\b/i.test(line)||(/^[A-Z0-9अ-ह][^.!?]{3,70}$/.test(line)&&line.split(/\s+/).length<=10))){headings.push({page:i+1,text:line});break}}});const unique=[];for(const h of headings)if(!unique.some(x=>x.page===h.page))unique.push(h);headings=unique;$('#toc').innerHTML=headings.length?headings.map(h=>`<button data-page="${h.page}">p.${h.page} — ${escapeHtml(h.text)}</button>`).join(''):'<span class="status">No obvious chapter headings found.</span>';document.querySelectorAll('.toc button').forEach(b=>b.onclick=()=>show(Number(b.dataset.page)));}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function load(){pdf=await pdfjsLib.getDocument(url).promise;for(let i=1;i<=pdf.numPages;i++){const page=await pdf.getPage(i),vp=page.getViewport({scale:1.5}),c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;c.dataset.page=i;await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;$('#pages').appendChild(c);const tc=await page.getTextContent();pages[i-1]=tc.items.map(x=>x.str).join(' ').replace(/\s+/g,' ').trim()}detectChapters();const saved=JSON.parse(localStorage.getItem(key)||'null');const bm=Number(localStorage.getItem(key+':bookmark')||0);$('#saved').textContent=bm?`Saved page ${bm}`:'No saved page yet.';show(saved?.page||bm||1,false);}
$('#play').onclick=()=>{playing=true;speak()};$('#stop').onclick=stop;$('#next').onclick=()=>{stop();next()};$('#prev').onclick=()=>{stop();prev()};$('#go').onclick=()=>{stop();show(Number($('#pageInput').value)||1)};$('#pageInput').onkeydown=e=>{if(e.key==='Enter')$('#go').click()};$('#bookmark').onclick=()=>{localStorage.setItem(key+':bookmark',current);$('#saved').textContent=`Saved page ${current}`;$('#status').textContent=`Page ${current} bookmarked.`};$('#resume').onclick=()=>{const p=Number(localStorage.getItem(key+':bookmark')||1);show(p)};$('#focus').onclick=()=>document.body.classList.toggle('focus');document.addEventListener('keydown',e=>{if(e.target.matches('input,select'))return;if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev();if(e.key===' '){e.preventDefault();playing?stop():($('#play').click())}});load().catch(e=>{$('#status').textContent='Could not open this PDF. Check that the file is publicly accessible.';console.error(e)});
</script></body></html>
